[workspace]
resolver = "2"
members = ["cuda", "graph", "rocky", "runtime", "schema"]

[workspace.dependencies]
# Ergonomic error handling
anyhow = "1.0"
thiserror = "2.0"

# Lightweight structured logging.
log = "0.4"

# Allocators and arenas.
bumpalo = "3.16"

# Numeric traits used across crates.
num-traits = "0.2"

# Benchmarking.
criterion = { version = "0.5", default-features = false }

# Safe CUDA abstractions.
cudarc = {  git = "https://github.com/kckeiks/cudarc", branch = "softmax-support", default-features = false, features = ["cublas", "cudnn", "cuda-version-from-build-system", "driver", "f16", "dynamic-loading", "std"]}

# f16 / bf16 support for mixed‑precision.
half = "2.4"

# Binary serialization & text encoding utilities
bincode = "1.3.3"
base64 = "0.22"
serde = { version = "1.0.203", features = ["derive"] }

# JSON serialization support.
serde_json = "1.0"

