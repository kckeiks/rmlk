[package]
name = "rmlk-server"
version = "0.0.0"
edition = "2021"
authors = ["M. Meier <m.wiresurfer@gmail.com>"]
description = "rmlk inference server"
publish = false

[[bin]]
name = "rmlk-server"
path = "src/main.rs"

[features]
default = []
# Optional parakeet-rs + ORT backend (CPU / host EP). Heavy native dep; off by default.
ort = ["dep:parakeet-rs"]
# ORT with CUDA EP. Implies `ort`.
cuda = ["ort", "parakeet-rs/cuda"]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
log = { workspace = true }
# Pinned to 0.3.6: uses ort 2.0.0-rc.12 (same as rmlk-runtime). 0.3.7+ needs
# ort rc.13 and conflicts with the workspace lock (rc.13 is CUDA-13-only).
parakeet-rs = { version = "=0.3.6", optional = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "=0.3.31", features = ["sink"] }
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
