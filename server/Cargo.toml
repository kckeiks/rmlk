[package]
name = "rmlk-server"
version = "0.0.0"
edition = "2021"
authors = ["M. Meier <m.wiresurfer@gmail.com>"]
description = "rmlk inference server"
publish = false

[[bin]]
name = "rmlk-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
