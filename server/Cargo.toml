[package]
name = "rmlk-server"
version = "0.0.0"
edition = "2021"
authors = ["M. Meier <m.wiresurfer@gmail.com>"]
description = "rmlk inference server"
publish = false

[[bin]]
name = "rmlk-server"
path = "src/main.rs"

[features]
default = []
# Optional ONNX Runtime backend (CPU / host EP). Heavy native dep; off by default.
ort = ["dep:ort"]
# ORT with CUDA EP. Implies `ort`.
cuda = ["ort", "ort/cuda"]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
log = { workspace = true }
# Same pin as `rmlk-runtime` (CUDA 12+13 prebuilts). Only linked with `--features ort|cuda`.
ort = { version = "=2.0.0-rc.12", optional = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "=0.3.31", features = ["sink"] }
http-body-util = "0.1"
proptest = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
