[package]
name = "rmlk-runtime"
version = "0.0.0"
edition = "2021"
authors = ["M. Meier <mi9uel9@gmail.com>"]

[dependencies]
bincode = "1.3.3"
cudarc = {  git = "https://github.com/kckeiks/cudarc.git", branch = "add-actv-and-bias-conv-forward", default-features = false, features = ["cublas", "cudnn", "cuda-version-from-build-system", "driver", "f16"]}
env_logger = "0.11"
half = "2.4"
log = "0.4"
ndarray = "0.15"
num-traits.workspace = true
rmlk-ir = { path = "../ir" }
rmlk-graph = { path = "../graph" }
rmlk-cuda = { path = "../cuda" }
quick-protobuf = "0.8"

[dev-dependencies]
image = "0.24"

