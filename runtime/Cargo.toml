[package]
name = "rmlk-runtime"
version = "0.0.0"
edition = "2021"
authors = ["M. Meier <m.wiresurfer@gmail.com>"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true, optional = true }
bincode = { workspace = true }
bumpalo = { workspace = true }
cudarc = { workspace = true }
log = { workspace = true }
half = { workspace = true }
num-traits = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

## Project internal crates.
rmlk-schema = { path = "../schema" }
rmlk-graph = { path = "../graph" }
rmlk-cuda = { path = "../cuda" }

[dev-dependencies]
# Floating‑point comparison helpers in tests.
approx = "0.5"

# Pretty logging for debugging.
env_logger = "0.11"

# Read/write image fixtures.
image = "0.24"

# N‑dimensional array helpers.
ndarray = "0.15"

# Parse ONNX TensorProto fixtures in node-suite tests.
quick-protobuf = "0.8"

# Tokenizers for examples.
tokenizers = "0.21"

# E2E artifact resolver (sidecar parse, SHA-256, fake/HTTP backends).
serde = { workspace = true }
sha2 = "0.10"
tempfile = "3"
ureq = "2.12"

# Pinned ORT 1.28 oracle for full-model e2e (see docs/compatibility.md).
ort = { version = "=2.0.0-rc.13", features = ["cuda"] }

[features]
default = []

# Operation dump helpers.
dump = ["base64"]

verbose = []
